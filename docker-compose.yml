# Local development stack: PostgreSQL 18 and two ReserveCore instances sharing one database.
# The credentials below are development-only values, documented on purpose. Do not reuse them.
# The `dev` profile seeds two demo merchants with the API keys listed in README.md.
# `docker compose --profile observability up` also starts Prometheus on http://localhost:9090.
name: reservecore

x-app: &app
  build: .
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    SPRING_PROFILES_ACTIVE: dev
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reservecore
    SPRING_DATASOURCE_USERNAME: reservecore
    SPRING_DATASOURCE_PASSWORD: reservecore_dev_only
  healthcheck:
    # The JRE image has no curl; bash /dev/tcp (not available in /bin/sh) probes the readiness endpoint.
    # Readiness answers 200 only when ready (503 otherwise, e.g. database down), so check the status line.
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 20s

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: reservecore
      POSTGRES_USER: reservecore
      POSTGRES_PASSWORD: reservecore_dev_only
    ports:
      # Host port 55432 avoids clashing with a locally installed PostgreSQL on 5432.
      - "55432:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql (not .../data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservecore -d reservecore"]
      interval: 2s
      timeout: 3s
      retries: 30

  app1:
    <<: *app
    ports:
      - "8081:8080"

  app2:
    <<: *app
    ports:
      - "8082:8080"

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["observability"]
    depends_on:
      - app1
      - app2
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

volumes:
  pgdata:
